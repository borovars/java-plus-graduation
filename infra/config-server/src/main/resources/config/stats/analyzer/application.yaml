kafka:
  value-serializer: ru.yandex.practicum.serializers.AvroSerializer
  key-serializer: org.apache.kafka.common.serialization.StringSerializer
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  analyzer-deserializer: ru.yandex.practicum.deserializers.UserActionDeserializer
  analyzer-similarity-deserializer: ru.yandex.practicum.deserializers.SimilarityDeserializer
  analyzer-group-user: analyzer-user-action-group
  analyzer-group-similarity: analyzer-similarity-group
  bootstrap-server: localhost:9092
  topics:
    user-action-topic: stats.user-actions.v1
    similarity-topic: stats.events-similarity.v1

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6549/analyzer-db
    username: analyzer-db
    password: analyzer-db
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health