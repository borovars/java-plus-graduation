kafka:
  value-serializer: ru.yandex.practicum.serializers.AvroSerializer
  key-serializer: org.apache.kafka.common.serialization.StringSerializer
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  aggregator-deserializer: ru.yandex.practicum.deserializers.UserActionDeserializer
  aggregator-group: aggregator-group
  bootstrap-server: localhost:9092
  topics:
    user-action-topic: stats.user-actions.v1
    similarity-topic: stats.events-similarity.v1

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health