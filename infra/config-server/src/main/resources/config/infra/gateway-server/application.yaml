server:
  port: 8080
spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery.locator.enabled: true
      routes:
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/admin/categories/**,/categories/**

        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/admin/events/*/comments/**,/users/*/events/*/comments/**,/events/*/comments/**

        - id: compilation-service
          uri: lb://compilation-service
          predicates:
            - Path=/admin/compilations/**,/compilations/**

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**,/users/*/events,/users/*/events/**,/events/*,/events

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests,/users/*/requests/**,/users/*/events/*/requests

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: stats-server
          uri: lb://stats-server
          predicates:
            - Path=/hit, /stats


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,configprops
  endpoint:
    gateway:
      enabled: true