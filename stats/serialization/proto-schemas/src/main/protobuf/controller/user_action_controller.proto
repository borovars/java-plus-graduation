syntax = "proto3";

package stats.service.collector;

import "google/protobuf/empty.proto";
import "messages/user_event.proto";

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.service.collector";
option java_outer_classname = "UserActionControllerSchema";

service UserActionController {
    rpc CollectUserAction (message.action.UserActionProto) returns (google.protobuf.Empty);
}