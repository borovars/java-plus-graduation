spring:
  application:
    name: analyzer
  config:
    import: "configserver:http://localhost:8888"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server

server:
  port: 0

grpc:
  server:
    port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
    healthcheck:
      enabled: true

  instance:
    prefer-ip-address: true
    ip-address: ${spring.cloud.client.ip-address:${HOSTNAME:localhost}}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      startup: ${random.int}